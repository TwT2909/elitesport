{% extends "base.html" %}
{% block title %}{{ t.new_client }} - EliteSport{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h4 class="mb-4"><i class="bi bi-person-plus-fill"></i> {{ t.new_client }}</h4>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <div class="card">
            <div class="card-body p-4">
                <form method="POST" action="/clients/create" enctype="multipart/form-data">
                    <div class="d-flex align-items-start gap-4 mb-4">
                        <div class="photo-upload">
                            <div class="photo-upload-placeholder" id="photo-preview-container">
                                <i class="bi bi-camera" style="font-size: 1.5rem;"></i>
                                <small class="mt-1">{{ t.upload_photo }}</small>
                            </div>
                            <input type="file" name="photo" accept="image/*" id="photo-input">
                        </div>
                        <div class="flex-grow-1">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">{{ t.last_name }} *</label>
                                    <input type="text" name="last_name" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">{{ t.first_name }} *</label>
                                    <input type="text" name="first_name" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">{{ t.patronymic }}</label>
                                    <input type="text" name="patronymic" class="form-control">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">{{ t.phone }} *</label>
                            <input type="tel" name="phone" class="form-control" placeholder="+7 (999) 123-45-67" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">{{ t.email }}</label>
                            <input type="email" name="email" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">{{ t.date_of_birth }}</label>
                            <input type="date" name="birth_date" class="form-control">
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">{{ t.gender }}</label>
                            <select name="gender" class="form-select">
                                <option value="male">{{ t.male }}</option>
                                <option value="female">{{ t.female }}</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">{{ t.notes }}</label>
                        <textarea name="notes" class="form-control" rows="3"></textarea>
                    </div>

                    {% if tariffs %}
                    <hr style="border-color:#2f3336; margin: 1.5rem 0;">
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-bookmark-star me-1" style="color:#1d9bf0;"></i>Абонемент при регистрации</label>
                        <select name="tariff_id" class="form-select" id="tariff-select-create">
                            <option value="">— Без абонемента —</option>
                            {% for tr in tariffs %}
                            <option value="{{ tr.id }}" data-price="{{ tr.price }}" data-days="{{ tr.duration_days }}">
                                {{ tr.name }} — {{ "%.0f"|format(tr.price) }} ₽ / {{ tr.duration_days }} дн.
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div id="tariff-summary" class="d-none mb-3 p-3" style="background:#0d1117; border:1px solid #1a4d6e; border-radius:10px;">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-secondary small">К оплате:</span>
                                <span class="fw-bold ms-2" style="color:#1d9bf0; font-size:1.1rem;" id="ts-price"></span>
                            </div>
                            <div>
                                <span class="text-secondary small">Действует до:</span>
                                <span class="fw-bold ms-2 text-white" id="ts-until"></span>
                            </div>
                        </div>
                    </div>
                    {% endif %}

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> {{ t.save }}</button>
                        <a href="/clients" class="btn btn-outline-secondary">{{ t.cancel }}</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
const tsel = document.getElementById('tariff-select-create');
if (tsel) {
    tsel.addEventListener('change', function() {
        const opt = tsel.selectedOptions[0];
        const summary = document.getElementById('tariff-summary');
        if (!opt || !opt.dataset.price) { summary.classList.add('d-none'); return; }
        const until = new Date();
        until.setDate(until.getDate() + parseInt(opt.dataset.days));
        document.getElementById('ts-price').textContent = parseFloat(opt.dataset.price).toLocaleString('ru-RU') + ' ₽';
        document.getElementById('ts-until').textContent = until.toLocaleDateString('ru-RU');
        summary.classList.remove('d-none');
    });
}

document.getElementById('photo-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(ev) {
            document.getElementById('photo-preview-container').innerHTML = '<img src="' + ev.target.result + '" style="width:120px;height:120px;object-fit:cover;border-radius:16px;">';
        };
        reader.readAsDataURL(file);
    }
});
</script>
{% endblock %}
